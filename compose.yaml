name: pakar

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pakar}
      POSTGRES_USER: ${POSTGRES_USER:-pakar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pakar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: production
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-pakar}:${POSTGRES_PASSWORD:-pakar}@database:5432/${POSTGRES_DB:-pakar}}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-pakar}:${POSTGRES_PASSWORD:-pakar}@database:5432/${POSTGRES_DB:-pakar}}
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pakar_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JOB_DELAY: ${JOB_DELAY:-0.08}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-33554432}
      MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-20971520}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-1073741824}
      MAX_FILES_PER_PROJECT: ${MAX_FILES_PER_PROJECT:-20}
      MAX_ACTIVE_PROJECTS_PER_USER: ${MAX_ACTIVE_PROJECTS_PER_USER:-100}
      PROJECT_RETENTION_DAYS: ${PROJECT_RETENTION_DAYS:-30}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-5000}
      POLICY_PROVIDER: ${POLICY_PROVIDER:-deterministic}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PAKAR_ALLOWED_LLM_HOSTS: ${PAKAR_ALLOWED_LLM_HOSTS:-openrouter.ai}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      LLM_STRUCTURED_OUTPUTS: ${LLM_STRUCTURED_OUTPUTS:-true}
      LLM_FALLBACK_POLICY: ${LLM_FALLBACK_POLICY:-raise}
      PAKAR_OPENROUTER_PROVIDER_ORDER: ${PAKAR_OPENROUTER_PROVIDER_ORDER:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2500}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-90}
      OASIS_PREPARE_TIMEOUT_SECONDS: ${OASIS_PREPARE_TIMEOUT_SECONDS:-900}
      OASIS_REPORT_TIMEOUT_SECONDS: ${OASIS_REPORT_TIMEOUT_SECONDS:-900}
      REPORT_AGENT_MAX_TOOL_CALLS: ${REPORT_AGENT_MAX_TOOL_CALLS:-2}
      REPORT_AGENT_MAX_REFLECTION_ROUNDS: ${REPORT_AGENT_MAX_REFLECTION_ROUNDS:-1}
      EMBEDDED_WORKER: "false"
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_STORAGE_PREFIX: ${FIREBASE_STORAGE_PREFIX:-pakar}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase-service-account.json}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      PRODUCTION: ${PRODUCTION:-false}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTH_MAX_FAILURES: ${AUTH_MAX_FAILURES:-10}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-300}
      OASIS_ENABLED: ${OASIS_ENABLED:-true}
      OASIS_RUNTIME_DIR: /opt/pakar/oasis_engine_runtime
      OASIS_DATA_DIR: /app/data/oasis/simulations
      DEFAULT_SIMULATION_ENGINE: ${DEFAULT_SIMULATION_ENGINE:-oasis}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      BPS_API_KEY: ${BPS_API_KEY:-}
      PAKAR_BPS_INDICATORS: ${PAKAR_BPS_INDICATORS:-[]}
      PAKAR_OPENROUTER_MAX_PRICE: ${PAKAR_OPENROUTER_MAX_PRICE:?Set PAKAR_OPENROUTER_MAX_PRICE from the env example}
      PAKAR_MAX_RUN_COST_USD: ${PAKAR_MAX_RUN_COST_USD:-0.10}
      PAKAR_CREDIT_RESERVE_USD: ${PAKAR_CREDIT_RESERVE_USD:-0.10}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backend_data:/app/data
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-/dev/null}:/app/secrets/firebase-service-account.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  worker:
    build:
      context: ./backend
      target: production
    command: ["python", "worker.py"]
    environment:
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-pakar}:${POSTGRES_PASSWORD:-pakar}@database:5432/${POSTGRES_DB:-pakar}}
      UPLOAD_DIR: /app/data/uploads
      POLICY_PROVIDER: ${POLICY_PROVIDER:-deterministic}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PAKAR_ALLOWED_LLM_HOSTS: ${PAKAR_ALLOWED_LLM_HOSTS:-openrouter.ai}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      LLM_STRUCTURED_OUTPUTS: ${LLM_STRUCTURED_OUTPUTS:-true}
      LLM_FALLBACK_POLICY: ${LLM_FALLBACK_POLICY:-raise}
      PAKAR_OPENROUTER_PROVIDER_ORDER: ${PAKAR_OPENROUTER_PROVIDER_ORDER:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2500}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-90}
      OASIS_PREPARE_TIMEOUT_SECONDS: ${OASIS_PREPARE_TIMEOUT_SECONDS:-900}
      OASIS_REPORT_TIMEOUT_SECONDS: ${OASIS_REPORT_TIMEOUT_SECONDS:-900}
      REPORT_AGENT_MAX_TOOL_CALLS: ${REPORT_AGENT_MAX_TOOL_CALLS:-2}
      REPORT_AGENT_MAX_REFLECTION_ROUNDS: ${REPORT_AGENT_MAX_REFLECTION_ROUNDS:-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-0.5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
      JOB_DELAY: ${JOB_DELAY:-0.08}
      MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-20971520}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-1073741824}
      MAX_FILES_PER_PROJECT: ${MAX_FILES_PER_PROJECT:-20}
      MAX_ACTIVE_PROJECTS_PER_USER: ${MAX_ACTIVE_PROJECTS_PER_USER:-100}
      PROJECT_RETENTION_DAYS: ${PROJECT_RETENTION_DAYS:-30}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-5000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_STORAGE_PREFIX: ${FIREBASE_STORAGE_PREFIX:-pakar}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase-service-account.json}
      OASIS_ENABLED: ${OASIS_ENABLED:-true}
      OASIS_RUNTIME_DIR: /opt/pakar/oasis_engine_runtime
      OASIS_DATA_DIR: /app/data/oasis/simulations
      DEFAULT_SIMULATION_ENGINE: ${DEFAULT_SIMULATION_ENGINE:-oasis}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      BPS_API_KEY: ${BPS_API_KEY:-}
      PAKAR_BPS_INDICATORS: ${PAKAR_BPS_INDICATORS:-[]}
      PAKAR_OPENROUTER_MAX_PRICE: ${PAKAR_OPENROUTER_MAX_PRICE:?Set PAKAR_OPENROUTER_MAX_PRICE from the env example}
      PAKAR_MAX_RUN_COST_USD: ${PAKAR_MAX_RUN_COST_USD:-0.10}
      PAKAR_CREDIT_RESERVE_USD: ${PAKAR_CREDIT_RESERVE_USD:-0.10}
    volumes:
      - backend_data:/app/data
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-/dev/null}:/app/secrets/firebase-service-account.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-pakar}:${POSTGRES_PASSWORD:-pakar}@database:5432/${POSTGRES_DB:-pakar}}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./evaluations:/evaluations:ro

volumes:
  backend_data:
    name: ${BACKEND_VOLUME_NAME:-pakar_backend_data}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-pakar_postgres_data}
