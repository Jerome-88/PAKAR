name: Publish Production Images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/publish-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free space for production images
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine GHCR image prefix
        id: repo_name
        run: |
          image_prefix=$(printf 'ghcr.io/%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          test -n "$image_prefix"
          printf 'prefix=%s\n' "$image_prefix" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          tags: |
            ${{ steps.repo_name.outputs.prefix }}-backend:latest
            ${{ steps.repo_name.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          build-args: |
            VITE_API_URL=/backend
            VITE_DEMO_MODE=false
          push: true
          tags: |
            ${{ steps.repo_name.outputs.prefix }}-frontend:latest
            ${{ steps.repo_name.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

