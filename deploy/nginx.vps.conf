# Preserve the HTTPS scheme supplied by the only public entrypoint, Caddy.
map $http_x_forwarded_proto $pakar_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    root /usr/share/nginx/html;
    index index.html;

    location /backend/ {
        proxy_pass http://backend:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pakar_forwarded_proto;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
